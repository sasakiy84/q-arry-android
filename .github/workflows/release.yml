name: Release Q-arry for Android

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/android-sdk"
          curl -fsSL --retry 2 https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          printf '%s  %s\n' 0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8 "$RUNNER_TEMP/android-tools.zip" | sha256sum -c
          mkdir -p "$sdk/cmdline-tools"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          cp -a "${ANDROID_HOME:?GitHub runner Android SDK is missing}/licenses" "$sdk/licenses"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" 'platforms;android-36' 'build-tools;36.0.0'
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
      - name: Test and build unsigned APK and AAB
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --dependency-verification=strict testDebugUnitTest lintRelease assembleRelease bundleRelease \
            -PunsignedRelease=true -PreleaseVersion="${RELEASE_TAG#v}" -PreleaseVersionCode="$VERSION_CODE"
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          bundle=app/build/outputs/bundle/release/app-release.aab
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo 'Build job must produce an unsigned APK'
            exit 1
          fi
          unzip -Z1 "$bundle" > "$RUNNER_TEMP/bundle-entries.txt"
          if grep -Ei '^META-INF/[^/]+\.(SF|RSA|DSA|EC)$' "$RUNNER_TEMP/bundle-entries.txt"; then
            echo 'Build job must produce an unsigned AAB'
            exit 1
          fi
          mkdir unsigned
          cp "$apk" "unsigned/q-arry-$RELEASE_TAG.apk"
          cp "$bundle" "unsigned/q-arry-$RELEASE_TAG.aab"
          cp app/build/outputs/mapping/release/mapping.txt "unsigned/mapping-$RELEASE_TAG.txt"
          (cd unsigned && sha256sum *.apk *.aab *.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release
          path: unsigned/*
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release
          path: unsigned
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verified signing tools
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 https://dl.google.com/android/repository/build-tools_r36_linux.zip -o "$RUNNER_TEMP/build-tools.zip"
          printf '%s  %s\n' 5d9ac77fb6ff43d9da518a337b4fcf8f9097113df531d99ccefe80ef7ce8250b "$RUNNER_TEMP/build-tools.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/build-tools.zip" -d "$RUNNER_TEMP/signing-tools"
      - name: Sign and verify release artifacts
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          (cd unsigned && sha256sum --check --status SHA256SUMS)
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo 'Set ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD in Actions secrets'
            exit 1
          fi
          umask 077
          signing_file=$(mktemp --suffix=.jks "$RUNNER_TEMP/qarry.XXXXXX")
          trap 'rm -f "$signing_file"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          unset ANDROID_KEYSTORE_BASE64
          mkdir dist
          signer_tool="$RUNNER_TEMP/signing-tools/android-16/apksigner"
          "$signer_tool" sign --ks "$signing_file" --ks-key-alias qarry-release --v4-signing-enabled false \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "dist/q-arry-$RELEASE_TAG.apk" "unsigned/q-arry-$RELEASE_TAG.apk"
          jarsigner -keystore "$signing_file" -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEYSTORE_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 -signedjar "dist/q-arry-$RELEASE_TAG.aab" \
            "unsigned/q-arry-$RELEASE_TAG.aab" qarry-release
          unset ANDROID_KEYSTORE_PASSWORD
          "$signer_tool" verify --verbose "dist/q-arry-$RELEASE_TAG.apk"
          jarsigner -verify "dist/q-arry-$RELEASE_TAG.aab"
          cp "unsigned/mapping-$RELEASE_TAG.txt" dist/
          (cd dist && sha256sum *.apk *.aab *.txt > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Q-arry $RELEASE_TAG" --generate-notes
